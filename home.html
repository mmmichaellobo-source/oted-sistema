<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GALVAL | Inicio</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      *{box-sizing:border-box} body{font-family:'Plus Jakarta Sans',sans-serif;background:#f1f5f9;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
      .sidebar{background:linear-gradient(180deg,#071326 0%,#0b1d3a 58%,#102b55 100%);box-shadow:8px 0 28px rgba(2,12,30,.16)}
      .nav-link{display:flex;align-items:center;padding:13px 20px;margin:5px 12px;border-radius:14px;color:#cbd5e1;transition:all .22s ease;text-transform:uppercase;letter-spacing:.035em}
      .sidebar button{text-transform:uppercase;letter-spacing:.035em;transition:background .22s ease,transform .22s ease,box-shadow .22s ease}
      .sidebar button[onclick="logout()"]:hover{background:#e11d48!important;color:#fff!important;transform:translateY(-2px);box-shadow:0 8px 22px rgba(225,29,72,.38)}
      .nav-link:hover{background:rgba(59,130,246,.20);color:#fff;transform:translateX(5px);box-shadow:inset 3px 0 0 #60a5fa}
      .nav-link.active{background:linear-gradient(100deg,#1769e8,#287cf0);color:white;box-shadow:0 8px 24px rgba(23,105,232,.38),inset 0 1px 0 rgba(255,255,255,.16)}
      .module-card{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:32px;box-shadow:0 8px 25px rgba(15,23,42,.07);transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s,border-color .28s,background .28s;cursor:pointer;will-change:transform}
      .module-card:before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;right:-90px;top:-110px;background:var(--tint);transition:transform .3s}
      .module-card:hover{transform:translateY(-11px) scale(1.018);box-shadow:0 24px 48px rgba(15,23,42,.19),0 0 0 2px color-mix(in srgb,var(--accent) 24%,transparent);border-color:var(--accent)}
      .module-card:hover:before{transform:scale(1.5)} .module-icon{transition:transform .28s,box-shadow .28s}.module-card:hover .module-icon{transform:scale(1.13) rotate(-5deg);box-shadow:0 10px 22px color-mix(in srgb,var(--accent) 25%,transparent)} .module-card:focus-visible{outline:3px solid var(--accent);outline-offset:4px} .module-card .module-action{transition:gap .22s,letter-spacing .22s} .module-card:hover .module-action{gap:12px;letter-spacing:.01em} .module-card .module-action-arrow{display:inline-block;transition:transform .22s} .module-card:hover .module-action-arrow{transform:translateX(6px)}
      .theme-toggle{transition:all .2s}.theme-toggle:hover{transform:rotate(12deg) scale(1.06)}
      .mobile-logout{transition:background .2s ease,color .2s ease,transform .2s ease,box-shadow .2s ease}
      .mobile-logout:hover,.mobile-logout:active{background:#e11d48!important;color:#fff!important;transform:translateY(-2px);box-shadow:0 7px 18px rgba(225,29,72,.28)}
      body.dark .mobile-logout{background:#3a2030;color:#fda4af}
      body.dark{background:#0b1220;color:#e5edf8} body.dark .main-area{background:#0b1220}
      body.dark .topbar{background:#111c30;border-color:#293a55} body.dark .topbar-title,body.dark .greeting-title,body.dark .section-title{color:#f1f5f9}
      body.dark .muted{color:#a6b5ca!important} body.dark .welcome-panel{background:linear-gradient(110deg,#172b4d,#1e293b);border-color:#334766}
      body.dark .module-card{--card:#142139;--line:#293b56;color:#e5edf8;box-shadow:0 8px 25px #0003} body.dark .module-card:hover{box-shadow:0 24px 48px rgba(0,0,0,.48),0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
      body.dark .module-card h3{color:#f8fafc} body.dark .module-card p{color:#b5c2d4}
      body.dark .avatar-wrap{background:#263750;border-color:#40516b} body.dark .theme-toggle{background:#263750;color:#facc15}
      @media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
    </style>
</head>
<body class="h-screen flex overflow-hidden">

    <!-- Sidebar (Menú Lateral) -->
    <aside class="sidebar w-64 text-white flex-shrink-0 flex flex-col hidden md:flex">
        <div class="h-16 flex items-center px-6 border-b border-gray-800">
            <!-- Aquí irá el logo dinámico en el futuro -->
            <div class="w-8 h-8 bg-red-600 rounded-full flex items-center justify-center mr-3">
                <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
            </div>
            <div>
                <h1 class="text-lg font-black tracking-widest uppercase">GALVAL</h1>
                <p class="text-[10px] text-gray-400 tracking-wider">CONTROL DE OPERACIONES</p>
            </div>
        </div>
        
        <nav class="flex-1 py-4">
            <a href="home.html" class="nav-link active">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span class="font-semibold text-sm">Inicio</span>
            </a>
            <a href="dashboard.html" class="nav-link">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"></path></svg>
                <span class="font-semibold text-sm">Dashboard</span>
            </a>
            <!-- NUEVO BOTÓN DE CONFIGURACIÓN -->
            <a href="configuracion.html" class="nav-link">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span class="font-semibold text-sm">Configuración</span>
            </a>
        </nav>

        <div class="p-4">
            <button onclick="logout()" class="w-full bg-gray-800 hover:bg-gray-700 text-white text-sm font-semibold py-2 px-4 rounded transition flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                Cerrar Sesión
            </button>
        </div>
    </aside>

    <!-- Contenido Principal -->
    <main class="main-area flex-1 flex flex-col min-w-0 overflow-hidden">
        <!-- Header -->
        <header class="topbar h-20 bg-white shadow-sm flex items-center justify-between px-5 md:px-8 border-b border-gray-200">
            <h2 class="topbar-title text-xl font-extrabold text-slate-800">Resumen General</h2>
            <button id="theme-toggle" class="theme-toggle ml-auto mr-4 p-3 rounded-xl bg-slate-100 text-slate-700" type="button" title="Cambiar apariencia" aria-label="Cambiar entre modo claro y oscuro">
              <svg id="theme-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6 7 7m10 10 1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            </button>
            
            <!-- Botón móvil para cerrar sesión -->
            <button id="mobile-logout" type="button" onclick="logout()"
                class="mobile-logout md:hidden ml-1 p-3 rounded-xl bg-rose-50 text-rose-600"
                title="Cerrar sesión" aria-label="Cerrar sesión">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                </svg>
            </button>

            <!-- Nombre, Puesto y Foto del Usuario -->
            <div class="flex items-center gap-3">
                <div class="text-right hidden sm:block">
                    <p id="user-name-display" class="text-sm font-bold text-gray-800">Cargando...</p>
                    <p id="user-role-display" class="text-xs text-gray-500 uppercase tracking-wider">Cargando...</p>
                </div>
                <!-- Contenedor de Foto de Perfil -->
                <div class="avatar-wrap w-10 h-10 rounded-full bg-gray-200 flex items-center justify-center border border-gray-300 overflow-hidden">
                    <img id="user-avatar" src="" alt="Perfil" class="w-full h-full object-cover hidden">
                    <!-- Icono por defecto si no hay foto -->
                    <svg id="user-avatar-icon" class="w-6 h-6 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                </div>
            </div>
        </header>

        <div class="flex-1 p-4 md:p-8 overflow-y-auto">
            <div class="max-w-6xl mx-auto">
                <!-- Saludo Dinámico -->
                <div class="welcome-panel rounded-3xl border border-blue-100 bg-gradient-to-r from-blue-50 to-indigo-50 p-7 md:p-9 mb-9 mt-2">
                    <h2 id="saludo-dinamico" class="greeting-title text-3xl md:text-4xl font-extrabold text-slate-800 mb-3">¡Hola de nuevo! 👋</h2>
                    <p class="muted text-slate-500">¿Qué módulo deseas abrir hoy?</p>
                </div>

                <!-- Tarjetas de módulos -->
                <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6">
                    
                    <!-- Tarjeta 1: Dashboard -->
                    <a href="dashboard.html" class="module-card group text-center flex flex-col items-center w-full" style="--accent:#f97316;--tint:#ffedd5;--card:#fff;--line:#e2e8f0">
                        <div class="module-icon w-16 h-16 bg-orange-50 text-orange-600 rounded-2xl flex items-center justify-center mb-6 shadow-sm">
                            <svg class="w-8 h-8 text-orange-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"></path></svg>
                        </div>
                        <h3 class="text-lg font-extrabold text-slate-800 mb-2 uppercase tracking-wide">Dashboard</h3>
                        <p class="muted text-sm text-slate-500 mb-6">Visualiza los gráficos, KPIs y tendencias de tus compras semanales.</p>
                        <span class="text-orange-600 font-bold text-sm flex items-center gap-2 group-hover:gap-3 transition-all">Ingresar al módulo &rarr;</span>
                    </a>

                </div>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://himmqcgvhfdqlkslbfej.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_ktqwZndOgJERsjdKXOtldQ_o0r0bo2L';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Verificar sesión
        const session = localStorage.getItem('oted_session');
        if (!session) {
            window.location.href = 'login.html';
        }

        // --- LÓGICA DEL SALUDO DINÁMICO ---
        function actualizarSaludo() {
            const hora = new Date().getHours();
            let saludo = "";
            
            if (hora >= 0 && hora < 12) {
                saludo = "¡Buenos días, colaboradores de GALVAL! ☀️";
            } else if (hora >= 12 && hora < 19) {
                saludo = "¡Buenas tardes, colaboradores de GALVAL! 🌤️";
            } else {
                saludo = "¡Buenas noches, colaboradores de GALVAL! 🌙";
            }
            
            document.getElementById('saludo-dinamico').innerText = saludo;
        }

        // --- LÓGICA PARA MOSTRAR NOMBRE Y PUESTO ---
        function cargarDatosUsuario() {
            const userData = JSON.parse(localStorage.getItem('oted_session'));
            
            let nombre = "Usuario de GALVAL";
            let fotoUrl = null;
            
            // Buscar el nombre en los metadatos de Supabase
            if (userData && userData.user && userData.user.user_metadata) {
                if (userData.user.user_metadata.full_name) {
                    nombre = userData.user.user_metadata.full_name;
                }
                if (userData.user.user_metadata.avatar_url) {
                    fotoUrl = userData.user.user_metadata.avatar_url;
                }
            }

            // Puesto por defecto (luego se puede conectar a la base de datos)
            const puesto = "Administrador"; 

            document.getElementById('user-name-display').innerText = nombre;
            document.getElementById('user-role-display').innerText = puesto;

            // Si hay foto de perfil, mostrarla
            if (fotoUrl) {
                const imgElement = document.getElementById('user-avatar');
                imgElement.src = fotoUrl;
                imgElement.classList.remove('hidden');
                document.getElementById('user-avatar-icon').classList.add('hidden');
            }
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            localStorage.removeItem('oted_session');
            window.location.href = 'login.html';
        }


        // Preferencia visual independiente de la sesión: claro por defecto, oscuro opcional.
        function aplicarTemaOTED(tema) {
            document.body.classList.toggle('dark', tema === 'dark');
            localStorage.setItem('galval_home_theme', tema);
            const icono = document.getElementById('theme-icon');
            if (icono) {
                icono.innerHTML = tema === 'dark'
                    ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.5 15.5A8.5 8.5 0 018.5 3.5 8.5 8.5 0 1020.5 15.5z"/>'
                    : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6 7 7m10 10 1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>';
            }
        }
        document.addEventListener('DOMContentLoaded', () => {
            aplicarTemaOTED(localStorage.getItem('galval_home_theme') || 'light');
            document.getElementById('theme-toggle')?.addEventListener('click', () => {
                aplicarTemaOTED(document.body.classList.contains('dark') ? 'light' : 'dark');
            });
        });

        // Ejecutar al cargar la página
        document.addEventListener('DOMContentLoaded', () => {
            actualizarSaludo();
            cargarDatosUsuario();
        });
    </script>
</body>
</html>
