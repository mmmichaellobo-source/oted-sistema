<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OT·ED | Acceso Corporativo</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #f3f4f6; }
        .bg-corporate { background-image: radial-gradient(#e5e7eb 1px, transparent 1px); background-size: 24px 24px; }
    </style>
</head>
<body class="h-screen flex items-center justify-center bg-corporate p-4">

    <!-- Tarjeta Principal -->
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden border border-gray-100">
        
        <!-- Header de la tarjeta -->
        <div class="bg-gray-900 px-8 py-6 text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-red-600"></div>
            
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-gray-800 border border-gray-700 mb-3 shadow-inner">
                <svg class="w-7 h-7 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
            </div>
            <h1 class="text-2xl font-black text-white tracking-widest uppercase">OT·ED</h1>
            <p class="text-xs text-gray-400 mt-1 uppercase tracking-widest font-semibold">Control de Operaciones</p>
        </div>

        <div class="p-8">
            <!-- Pestañas -->
            <div class="flex border-b border-gray-200 mb-8">
                <button type="button" onclick="switchTab('login')" id="tab-login-btn" class="flex-1 pb-3 text-red-600 border-b-2 border-red-600 font-bold transition uppercase text-xs tracking-wider">Iniciar Sesión</button>
                <button type="button" onclick="switchTab('register')" id="tab-register-btn" class="flex-1 pb-3 text-gray-400 font-bold hover:text-gray-600 transition uppercase text-xs tracking-wider">Crear Cuenta</button>
            </div>
            
            <!-- FORMULARIO DE LOGIN -->
            <form id="login-form" class="block">
                <div class="mb-5">
                    <label class="block text-xs font-bold text-gray-600 mb-2 uppercase tracking-wide">Correo Electrónico</label>
                    <input type="email" id="login-email" required class="w-full px-4 py-3 bg-gray-50 border border-gray-300 text-gray-800 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500 focus:bg-white outline-none transition-all" placeholder="mm.michaellobo@gmail.com">
                </div>
                <div class="mb-6">
                    <label class="block text-xs font-bold text-gray-600 mb-2 uppercase tracking-wide">Contraseña</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-3 bg-gray-50 border border-gray-300 text-gray-800 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500 focus:bg-white outline-none transition-all" placeholder="••••••••">
                </div>
                
                <div id="login-error" class="text-red-600 text-sm mb-4 hidden text-center font-semibold bg-red-50 py-2 rounded-lg border border-red-100"></div>
                
                <button type="submit" id="login-btn" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold uppercase tracking-wider py-3.5 px-4 rounded-lg transition-all duration-200 shadow-lg shadow-red-600/30">
                    Ingresar al Sistema
                </button>
            </form>

            <!-- FORMULARIO DE REGISTRO (Oculto) -->
            <form id="register-form" class="hidden">
                <div class="mb-4">
                    <label class="block text-xs font-bold text-gray-600 mb-2 uppercase tracking-wide">Nombre Completo</label>
                    <input type="text" id="register-name" required class="w-full px-4 py-3 bg-gray-50 border border-gray-300 text-gray-800 rounded-lg focus:ring-2 focus:ring-red-500 outline-none transition-all" placeholder="Ej. Juan Pérez">
                </div>
                <div class="mb-4">
                    <label class="block text-xs font-bold text-gray-600 mb-2 uppercase tracking-wide">Correo Electrónico</label>
                    <input type="email" id="register-email" required class="w-full px-4 py-3 bg-gray-50 border border-gray-300 text-gray-800 rounded-lg focus:ring-2 focus:ring-red-500 outline-none transition-all" placeholder="correo@oted.com">
                </div>
                <div class="mb-6">
                    <label class="block text-xs font-bold text-gray-600 mb-2 uppercase tracking-wide">Contraseña</label>
                    <input type="password" id="register-password" required class="w-full px-4 py-3 bg-gray-50 border border-gray-300 text-gray-800 rounded-lg focus:ring-2 focus:ring-red-500 outline-none transition-all" placeholder="••••••••">
                </div>
                
                <div id="register-error" class="text-red-600 text-sm mb-4 hidden text-center font-semibold bg-red-50 py-2 rounded-lg"></div>
                <div id="register-success" class="text-green-600 text-sm mb-4 hidden text-center font-semibold bg-green-50 py-2 rounded-lg"></div>
                
                <button type="submit" id="register-btn" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold uppercase tracking-wider py-3.5 px-4 rounded-lg transition-all duration-200 shadow-lg">
                    Registrarme
                </button>
            </form>

        </div>
    </div>

    <script>
        // ⚠️ CONFIGURACIÓN DE SUPABASE (REVISA QUE NO HAYA ESPACIOS NI BARRAS AL FINAL)
        const SUPABASE_URL = 'https://himmqcgvhfdqlkslbfej.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_ktqwZndOgJERsjdKXOtldQ_o0r0bo2L'; // <-- Reemplaza esto con tu llave completa (sb_publishable_...)
        
        let supabaseClient;

        // Validación para que no falle si la URL está mal
        try {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch (e) {
            console.error("Error al conectar con Supabase. Revisa tu URL y tu Key.", e);
        }

        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const loginBtnTab = document.getElementById('tab-login-btn');
            const registerBtnTab = document.getElementById('tab-register-btn');

            if (tab === 'login') {
                loginForm.classList.remove('hidden'); registerForm.classList.add('hidden');
                loginBtnTab.className = 'flex-1 pb-3 text-red-600 border-b-2 border-red-600 font-bold transition uppercase text-xs tracking-wider';
                registerBtnTab.className = 'flex-1 pb-3 text-gray-400 font-bold hover:text-gray-600 transition uppercase text-xs tracking-wider';
            } else {
                loginForm.classList.add('hidden'); registerForm.classList.remove('hidden');
                registerBtnTab.className = 'flex-1 pb-3 text-red-600 border-b-2 border-red-600 font-bold transition uppercase text-xs tracking-wider';
                loginBtnTab.className = 'flex-1 pb-3 text-gray-400 font-bold hover:text-gray-600 transition uppercase text-xs tracking-wider';
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!supabaseClient) {
                alert("Error de configuración: Revisa la URL y la Key en el código.");
                return;
            }

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('login-btn');
            const errorDiv = document.getElementById('login-error');
            
            btn.innerText = "Verificando..."; btn.disabled = true; errorDiv.classList.add('hidden');

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

                if (error) {
                    errorDiv.innerText = error.message;
                    errorDiv.classList.remove('hidden');
                    btn.innerText = "Ingresar al Sistema"; btn.disabled = false;
                } else {
                    localStorage.setItem('oted_session', JSON.stringify(data.session));
                    window.location.href = 'dashboard.html';
                }
            } catch (err) {
                errorDiv.innerText = "Error de conexión. Revisa la consola (F12).";
                errorDiv.classList.remove('hidden');
                btn.innerText = "Ingresar al Sistema"; btn.disabled = false;
            }
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!supabaseClient) return;

            const name = document.getElementById('register-name').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const btn = document.getElementById('register-btn');
            const errorDiv = document.getElementById('register-error');
            const successDiv = document.getElementById('register-success');
            
            btn.innerText = "Registrando..."; btn.disabled = true; 
            errorDiv.classList.add('hidden'); successDiv.classList.add('hidden');

            try {
                const { data, error } = await supabaseClient.auth.signUp({ 
                    email: email, password: password, options: { data: { full_name: name } }
                });

                if (error) {
                    errorDiv.innerText = "Error: " + error.message;
                    errorDiv.classList.remove('hidden');
                    btn.innerText = "Registrarme"; btn.disabled = false;
                } else {
                    successDiv.innerText = "¡Cuenta creada! Ya puedes iniciar sesión.";
                    successDiv.classList.remove('hidden');
                    btn.innerText = "Registrarme"; btn.disabled = false;
                    document.getElementById('register-form').reset();
                    setTimeout(() => { switchTab('login'); }, 2000);
                }
            } catch (err) {
                errorDiv.innerText = "Error de red.";
                errorDiv.classList.remove('hidden');
                btn.innerText = "Registrarme"; btn.disabled = false;
            }
        });
    </script>
</body>
</html>
