<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OT·ED | Sistema Interno</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; }
        .tab-active { color: #2563eb; border-bottom: 2px solid #2563eb; font-weight: 600; }
        .tab-inactive { color: #9ca3af; font-weight: 500; }
    </style>
</head>
<body class="h-screen flex items-center justify-center">

    <!-- Tarjeta Principal -->
    <div class="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden border border-gray-100">
        
        <!-- Línea superior azul decorativa -->
        <div class="h-2 w-full bg-blue-600"></div>

        <div class="p-8">
            <!-- Logo y Título -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-50 mb-4">
                    <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                </div>
                <h1 class="text-2xl font-bold text-gray-800">OT·ED</h1>
                <p class="text-sm text-gray-500 mt-1">Sistema Interno de Reportes</p>
            </div>

            <!-- Pestañas -->
            <div class="flex border-b border-gray-200 mb-6">
                <button type="button" onclick="switchTab('login')" id="tab-login-btn" class="flex-1 pb-3 text-blue-600 tab-active transition">Iniciar Sesión</button>
                <button type="button" onclick="switchTab('register')" id="tab-register-btn" class="flex-1 pb-3 tab-inactive hover:text-gray-600 transition">Crear Cuenta</button>
            </div>
            
            <!-- FORMULARIO DE LOGIN -->
            <form id="login-form" class="block">
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Correo Electrónico</label>
                    <input type="email" id="login-email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" placeholder="admin@oted.com">
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Contraseña</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" placeholder="••••••••">
                </div>
                
                <div id="login-error" class="text-red-500 text-sm mb-4 hidden text-center font-medium"></div>
                
                <button type="submit" id="login-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 shadow-md">
                    Ingresar al Sistema
                </button>
                
                <div class="text-center mt-4">
                    <a href="#" class="text-sm text-blue-500 hover:underline">¿Olvidaste tu contraseña?</a>
                </div>
            </form>

            <!-- FORMULARIO DE REGISTRO (Oculto por defecto) -->
            <form id="register-form" class="hidden">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Nombre Completo</label>
                    <input type="text" id="register-name" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" placeholder="Ej. Juan Pérez">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Correo Electrónico</label>
                    <input type="email" id="register-email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" placeholder="correo@oted.com">
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Contraseña</label>
                    <input type="password" id="register-password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" placeholder="••••••••">
                </div>
                
                <div id="register-error" class="text-red-500 text-sm mb-4 hidden text-center font-medium"></div>
                <div id="register-success" class="text-green-600 text-sm mb-4 hidden text-center font-medium"></div>
                
                <button type="submit" id="register-btn" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 shadow-md">
                    Registrarme
                </button>
            </form>

        </div>
    </div>

    <script>
        // ⚠️ CONFIGURACIÓN DE SUPABASE
        const SUPABASE_URL = 'TU_PROJECT_URL_AQUI'; 
        const SUPABASE_KEY = 'TU_PUBLISHABLE_KEY_AQUI';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // LÓGICA DE PESTAÑAS
        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const loginBtnTab = document.getElementById('tab-login-btn');
            const registerBtnTab = document.getElementById('tab-register-btn');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                loginBtnTab.className = 'flex-1 pb-3 text-blue-600 tab-active transition';
                registerBtnTab.className = 'flex-1 pb-3 tab-inactive hover:text-gray-600 transition';
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                registerBtnTab.className = 'flex-1 pb-3 text-blue-600 tab-active transition';
                loginBtnTab.className = 'flex-1 pb-3 tab-inactive hover:text-gray-600 transition';
            }
        }

        // LÓGICA DE INICIO DE SESIÓN
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('login-btn');
            const errorDiv = document.getElementById('login-error');
            
            btn.innerText = "Verificando..."; btn.disabled = true; errorDiv.classList.add('hidden');

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                errorDiv.innerText = "Error: " + error.message;
                errorDiv.classList.remove('hidden');
                btn.innerText = "Ingresar al Sistema"; btn.disabled = false;
            } else {
                localStorage.setItem('oted_session', JSON.stringify(data.session));
                window.location.href = 'dashboard.html';
            }
        });

        // LÓGICA DE REGISTRO
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('register-name').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const btn = document.getElementById('register-btn');
            const errorDiv = document.getElementById('register-error');
            const successDiv = document.getElementById('register-success');
            
            btn.innerText = "Registrando..."; btn.disabled = true; 
            errorDiv.classList.add('hidden'); successDiv.classList.add('hidden');

            // Registrar en Supabase (guardando el nombre en metadata)
            const { data, error } = await supabaseClient.auth.signUp({ 
                email: email, 
                password: password,
                options: { data: { full_name: name } }
            });

            if (error) {
                errorDiv.innerText = "Error: " + error.message;
                errorDiv.classList.remove('hidden');
                btn.innerText = "Registrarme"; btn.disabled = false;
            } else {
                successDiv.innerText = "¡Cuenta creada! Ya puedes iniciar sesión.";
                successDiv.classList.remove('hidden');
                btn.innerText = "Registrarme"; btn.disabled = false;
                document.getElementById('register-form').reset();
                // Opcional: cambiar a la pestaña de login después de 2 segundos
                setTimeout(() => { switchTab('login'); }, 2000);
            }
        });
    </script>
</body>
</html>
