<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OT·ED | Acceso al Sistema</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #111827; }
        /* Patrón de fondo sutil tipo rejilla */
        .bg-pattern { background-image: radial-gradient(#374151 1px, transparent 1px); background-size: 20px 20px; }
    </style>
</head>
<body class="h-screen flex items-center justify-center bg-pattern">

    <!-- Tarjeta Principal -->
    <div class="bg-gray-800 rounded-lg shadow-2xl w-full max-w-md overflow-hidden border border-gray-700">
        
        <!-- Línea superior roja -->
        <div class="h-1.5 w-full bg-red-600"></div>

        <div class="p-8">
            <!-- Logo y Título -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gray-900 border-2 border-red-600 mb-4 shadow-[0_0_15px_rgba(220,38,38,0.5)]">
                    <!-- Icono de engranaje/motor -->
                    <svg class="w-8 h-8 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </div>
                <h1 class="text-3xl font-black text-white tracking-widest uppercase">OT·ED</h1>
                <p class="text-sm text-gray-400 mt-1 uppercase tracking-wider font-semibold">Control de Operaciones</p>
            </div>

            <!-- Pestañas -->
            <div class="flex border-b border-gray-700 mb-6">
                <button type="button" onclick="switchTab('login')" id="tab-login-btn" class="flex-1 pb-3 text-red-500 border-b-2 border-red-500 font-bold transition uppercase text-sm tracking-wide">Ingresar</button>
                <button type="button" onclick="switchTab('register')" id="tab-register-btn" class="flex-1 pb-3 text-gray-500 font-semibold hover:text-gray-300 transition uppercase text-sm tracking-wide">Registro</button>
            </div>
            
            <!-- FORMULARIO DE LOGIN -->
            <form id="login-form" class="block">
                <div class="mb-5">
                    <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wide">Correo Electrónico</label>
                    <input type="email" id="login-email" required class="w-full px-4 py-3 bg-gray-900 border border-gray-700 text-white rounded focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition" placeholder="admin@oted.com">
                </div>
                <div class="mb-6">
                    <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wide">Contraseña</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-3 bg-gray-900 border border-gray-700 text-white rounded focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition" placeholder="••••••••">
                </div>
                
                <div id="login-error" class="text-red-400 text-sm mb-4 hidden text-center font-medium bg-red-900/30 py-2 rounded"></div>
                
                <button type="submit" id="login-btn" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold uppercase tracking-wider py-3 px-4 rounded transition duration-200 shadow-lg shadow-red-900/50">
                    Ingresar al Sistema
                </button>
            </form>

            <!-- FORMULARIO DE REGISTRO (Oculto) -->
            <form id="register-form" class="hidden">
                <div class="mb-4">
                    <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wide">Nombre Completo</label>
                    <input type="text" id="register-name" required class="w-full px-4 py-3 bg-gray-900 border border-gray-700 text-white rounded focus:ring-2 focus:ring-red-500 outline-none transition" placeholder="Ej. Juan Pérez">
                </div>
                <div class="mb-4">
                    <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wide">Correo Electrónico</label>
                    <input type="email" id="register-email" required class="w-full px-4 py-3 bg-gray-900 border border-gray-700 text-white rounded focus:ring-2 focus:ring-red-500 outline-none transition" placeholder="correo@oted.com">
                </div>
                <div class="mb-6">
                    <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wide">Contraseña</label>
                    <input type="password" id="register-password" required class="w-full px-4 py-3 bg-gray-900 border border-gray-700 text-white rounded focus:ring-2 focus:ring-red-500 outline-none transition" placeholder="••••••••">
                </div>
                
                <div id="register-error" class="text-red-400 text-sm mb-4 hidden text-center font-medium bg-red-900/30 py-2 rounded"></div>
                <div id="register-success" class="text-green-400 text-sm mb-4 hidden text-center font-medium bg-green-900/30 py-2 rounded"></div>
                
                <button type="submit" id="register-btn" class="w-full bg-gray-700 hover:bg-gray-600 text-white font-bold uppercase tracking-wider py-3 px-4 rounded transition duration-200">
                    Registrarme
                </button>
            </form>

        </div>
    </div>

    <script>
        const SUPABASE_URL = 'TU_PROJECT_URL_AQUI'; 
        const SUPABASE_KEY = 'TU_PUBLISHABLE_KEY_AQUI';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const loginBtnTab = document.getElementById('tab-login-btn');
            const registerBtnTab = document.getElementById('tab-register-btn');

            if (tab === 'login') {
                loginForm.classList.remove('hidden'); registerForm.classList.add('hidden');
                loginBtnTab.className = 'flex-1 pb-3 text-red-500 border-b-2 border-red-500 font-bold transition uppercase text-sm tracking-wide';
                registerBtnTab.className = 'flex-1 pb-3 text-gray-500 font-semibold hover:text-gray-300 transition uppercase text-sm tracking-wide';
            } else {
                loginForm.classList.add('hidden'); registerForm.classList.remove('hidden');
                registerBtnTab.className = 'flex-1 pb-3 text-red-500 border-b-2 border-red-500 font-bold transition uppercase text-sm tracking-wide';
                loginBtnTab.className = 'flex-1 pb-3 text-gray-500 font-semibold hover:text-gray-300 transition uppercase text-sm tracking-wide';
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('login-btn');
            const errorDiv = document.getElementById('login-error');
            
            btn.innerText = "Verificando..."; btn.disabled = true; errorDiv.classList.add('hidden');

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                errorDiv.innerText = "Credenciales incorrectas";
                errorDiv.classList.remove('hidden');
                btn.innerText = "Ingresar al Sistema"; btn.disabled = false;
            } else {
                localStorage.setItem('oted_session', JSON.stringify(data.session));
                window.location.href = 'dashboard.html';
            }
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('register-name').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const btn = document.getElementById('register-btn');
            const errorDiv = document.getElementById('register-error');
            const successDiv = document.getElementById('register-success');
            
            btn.innerText = "Registrando..."; btn.disabled = true; 
            errorDiv.classList.add('hidden'); successDiv.classList.add('hidden');

            const { data, error } = await supabaseClient.auth.signUp({ 
                email: email, password: password, options: { data: { full_name: name } }
            });

            if (error) {
                errorDiv.innerText = "Error: " + error.message;
                errorDiv.classList.remove('hidden');
                btn.innerText = "Registrarme"; btn.disabled = false;
            } else {
                successDiv.innerText = "¡Cuenta creada! Ya puedes iniciar sesión.";
                successDiv.classList.remove('hidden');
                btn.innerText = "Registrarme"; btn.disabled = false;
                document.getElementById('register-form').reset();
                setTimeout(() => { switchTab('login'); }, 2000);
            }
        });
    </script>
</body>
</html>
